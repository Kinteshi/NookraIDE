[package]
name = "avf-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The installed command; the package keeps its name (cargo -p avf-daemon).
[[bin]]
name = "quirecode-daemon"
path = "src/main.rs"

[features]
default = ["native-protocol"]
native-protocol = []

[dependencies]
avf-protocol = { path = "../avf-protocol" }
axum.workspace = true
cap-std.workspace = true
futures-util.workspace = true
notify.workspace = true
portable-pty = "0.9"
sha2 = "0.10"
# TLS for daemons that listen beyond loopback (hosts on a LAN); ring avoids a CMake toolchain.
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
rcgen = { version = "0.14.9", default-features = false, features = ["crypto", "pem", "ring"] }
qrcode = { version = "0.14", default-features = false }
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
# statvfs for the guest's storage use in the stats the app shows.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.26"
