# Every push and pull request: the daemon's and the app's tests, a debug build, and the third-party notices current.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    name: Daemon tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The daemon's search runs ripgrep, as the guest has it; one test searches.
      - run: sudo apt-get install -y ripgrep
      - run: cargo test -p avf-daemon -p avf-protocol

  app:
    name: App tests, debug build, notices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The app builds with JDK 17; its tests run on 21, as Aardink's classes are Java 21 bytecode.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            17
      # Only platform-tools: the action's default list includes "tools", which the SDK no longer has.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests and a debug build
        working-directory: apps/native-android-ide
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Third-party notices are current
        run: |
          python3 scripts/third-party-notices.py
          git diff --exit-code -- apps/native-android-ide/app/src/main/assets/licenses/notices.json \
            || { echo "::error::notices.json is out of date: run python3 scripts/third-party-notices.py and commit it"; exit 1; }
