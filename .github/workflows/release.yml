# A tag v0.1.0 makes the release: the signed APK with the arm64 guest daemon inside, the daemon for Linux and WSL
# hosts (x86_64 and arm64), checksums, and a GitHub release with notes from docs/releases/<version>.md.
#
# Secrets: RELEASE_KEYSTORE (the keystore, base64), RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*"]
  # A dry run: everything a release builds and signs, kept as the run's artifact instead of published.
  workflow_dispatch:
    inputs:
      version:
        description: Version to build as (its notes must exist in docs/releases/)
        default: "0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: The tag, the daemon's version and the notes agree
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          daemon=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/avf-daemon/Cargo.toml | head -1)
          [ "$daemon" = "$version" ] || { echo "::error::tag $version, but avf-daemon is $daemon"; exit 1; }
          [ -f "docs/releases/$version.md" ] || { echo "::error::docs/releases/$version.md is missing"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu,x86_64-unknown-linux-gnu
      # Zig and cargo-zigbuild, for glibc 2.28 builds: the versions the daemon is built with locally.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: cargo install --locked cargo-zigbuild@0.23.4
      - name: The daemon, for the tablet's guest and for Linux and WSL hosts
        run: |
          cargo zigbuild --release -p avf-daemon --target aarch64-unknown-linux-gnu.2.28
          cargo zigbuild --release -p avf-daemon --target x86_64-unknown-linux-gnu.2.28
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            17
      # Only platform-tools: the action's default list includes "tools", which the SDK no longer has.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: The signed APK, with the arm64 daemon inside
        working-directory: apps/native-android-ide
        env:
          AVF_KEYSTORE: ${{ runner.temp }}/release.jks
          AVF_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          AVF_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          AVF_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > "$AVF_KEYSTORE"
          ./gradlew :app:testDebugUnitTest :app:assembleRelease -Pavf.version="$VERSION"
          rm -f "$AVF_KEYSTORE"
      - name: Files and checksums
        run: |
          mkdir dist
          cp apps/native-android-ide/app/build/outputs/apk/release/app-release.apk "dist/quirecode-$VERSION.apk"
          cp target/aarch64-unknown-linux-gnu/release/quirecode-daemon "dist/quirecode-daemon-$VERSION-linux-arm64"
          cp target/x86_64-unknown-linux-gnu/release/quirecode-daemon "dist/quirecode-daemon-$VERSION-linux-x86_64"
          cp scripts/install-native-daemon.sh dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Signed with the release key, not a debug key
        run: |
          signer=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "dist/quirecode-$VERSION.apk")
          echo "$signer"
          if echo "$signer" | grep -q "CN=Android Debug"; then echo "::error::the APK is debug-signed: the release key's secrets are missing"; exit 1; fi
      - name: Dry run's files
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: quirecode-${{ env.VERSION }}-dry-run
          path: dist/
          retention-days: 7
      - name: GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "QuireCode $VERSION" --notes-file "docs/releases/$VERSION.md"
